apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medusa.fullname" . }}
  labels:
    {{- include "medusa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.medusa.replicaCount }}
  selector:
    matchLabels:
      {{- include "medusa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medusa.labels" . | nindent 8 }}
    spec:
      containers:
        - name: medusa
          image: "{{ .Values.medusa.image.repository }}:{{ .Values.medusa.image.tag }}"
          imagePullPolicy: {{ .Values.medusa.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.medusa.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.medusa.env.NODE_ENV | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DATABASE_URL
            - name: MEDUSA_BACKEND_URL
              value: {{ .Values.medusa.env.MEDUSA_BACKEND_URL | quote }}
            - name: MEDUSA_WORKER_MODE
              value: {{ .Values.medusa.env.MEDUSA_WORKER_MODE | quote }}
            - name: DISABLE_MEDUSA_ADMIN
              value: {{ .Values.medusa.env.DISABLE_MEDUSA_ADMIN | quote }}
            - name: STORE_CORS
              value: {{ .Values.medusa.env.STORE_CORS | quote }}
            - name: ADMIN_CORS
              value: {{ .Values.medusa.env.ADMIN_CORS | quote }}
            - name: AUTH_CORS
              value: {{ .Values.medusa.env.AUTH_CORS | quote }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}

          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}

          resources:
            {{- toYaml .Values.medusa.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa.fullname" . }}
  labels:
    {{- include "medusa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "medusa.selectorLabels" . | nindent 4 }}

---
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "medusa.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "medusa.databaseUrl" . | quote }}
{{- end }}
