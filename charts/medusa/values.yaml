## Default values for Medusa Helm chart

## Medusa Deployment Configuration
medusa:
  replicaCount: 1
  
  image:
    repository: medusa-backend-trail
    tag: "latest"
    pullPolicy: IfNotPresent
  
  port: 9000
  
  ## Environment variables
  env:
    NODE_ENV: production
    MEDUSA_WORKER_MODE: shared
    DISABLE_MEDUSA_ADMIN: "false"
    STORE_CORS: "http://localhost:8000,http://localhost:3000"
    ADMIN_CORS: "http://localhost:9000,http://localhost:7001"
    AUTH_CORS: "http://localhost:9000,http://localhost:7001"
    MEDUSA_BACKEND_URL: ""
  
  ## Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

## Database Configuration
database:
  host: postgres-postgresql.db.svc.cluster.local
  port: 5432
  name: medusa_db
  user: medusa
  password: medusa
  sslmode: disable

## Redis Configuration
redis:
  enabled: false
  # When enabled, set the Redis URL
  # url: redis://redis.db.svc.cluster.local:6379

## Secret Configuration
secret:
  create: true
  name: medusa-db-secret

## Database Migration Job
migration:
  enabled: true
  backoffLimit: 1

## Service Configuration
service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

## Probe Configuration
probes:
  liveness:
    enabled: false
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 5

