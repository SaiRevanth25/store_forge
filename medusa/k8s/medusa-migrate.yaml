apiVersion: batch/v1
kind: Job
metadata:
  name: medusa-migrate
  namespace: demo-store
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: medusa-backend-test
          imagePullPolicy: IfNotPresent
          command: ["npx", "medusa", "db:migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medusa-db-secret
                  key: DATABASE_URL
