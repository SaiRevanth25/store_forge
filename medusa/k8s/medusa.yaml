apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa
  namespace: demo-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa
  template:
    metadata:
      labels:
        app: medusa
    spec:
      containers:
        - name: medusa
          image: medusa-backend-test
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medusa-db-secret
                  key: DATABASE_URL
            - name: MEDUSA_BACKEND_URL
              value: ""
            - name: MEDUSA_WORKER_MODE
              value: "shared"
            - name: DISABLE_MEDUSA_ADMIN
              value: "false"
            - name: STORE_CORS
              value: "http://localhost:8000,http://localhost:3000"
            - name: ADMIN_CORS
              value: "http://localhost:9000,http://localhost:7001"
            - name: AUTH_CORS
              value: "http://localhost:9000,http://localhost:7001"
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: medusa
  namespace: demo-store
spec:
  selector:
    app: medusa
  ports:
    - port: 9000
      targetPort: 9000
