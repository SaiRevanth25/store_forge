apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: medusa_db
            - name: POSTGRES_USER
              value: medusa
            - name: POSTGRES_PASSWORD
              value: medusa
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U medusa -d medusa_db
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None   # Headless service 
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
